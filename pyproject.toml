[project]
name = "admrl-mcp"
version = "0.1.0"
description = "Model Context Protocol server for talking to an Admiral fleet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Admiral Operations" }]
dependencies = [
    "httpx>=0.28.1,<1",
    "mcp>=1.9,<2",
    "uvicorn>=0.30",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
admrl-mcp = "admrl_mcp.server:main"
admrl-mcp-http = "admrl_mcp.hosted:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admrl_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true
